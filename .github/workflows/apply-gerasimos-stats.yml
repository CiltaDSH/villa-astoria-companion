name: Apply St Gerasimos distance strip

on:
  push:
    branches:
      - agent/photo-card-polish
    paths:
      - .github/workflows/apply-gerasimos-stats.yml
      - scripts/add_gerasimos_stats.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-card-polish
      - name: Apply static stats
        run: python scripts/add_gerasimos_stats.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add destinations.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add St Gerasimos Villa distance strip"
            git push origin HEAD:agent/photo-card-polish
          fi
