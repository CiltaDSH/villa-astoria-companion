name: Apply guest-facing 2027 readiness cleanup
on:
  push:
    branches: [agent/2027-readiness]
    paths:
      - .github/workflows/apply-guest-readiness.yml
      - scripts/guest_readiness_cleanup.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/2027-readiness
      - name: Clean guest-facing development wording
        run: python scripts/guest_readiness_cleanup.py
      - name: Commit cleaned pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add getting-ready.html nearby.html help.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Polish 2027 guest-facing readiness language" && git push origin HEAD:agent/2027-readiness; fi
