name: Apply static Villa distance polish

on:
  push:
    branches:
      - agent/add-villa-distances
    paths:
      - .github/workflows/apply-static-distances.yml
      - scripts/hardcode_distances.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-villa-distances
          fetch-depth: 0
      - name: Hard-code distance information
        run: python scripts/hardcode_distances.py
      - name: Remove experimental runtime previews
        run: |
          rm -f distance-polish.js distance-polish-loader.js preview-dining.html preview-explore.html iphone-distance-static-test.html
          git fetch origin main
          git checkout origin/main -- sw.js
      - name: Commit static result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dining.html destinations.html sw.js
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hard-code Villa distance guidance for Safari"
            git push origin HEAD:agent/add-villa-distances
          fi
